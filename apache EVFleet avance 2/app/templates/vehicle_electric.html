<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV Fleet</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c10;--surface:#0f1520;--surface2:#151e2e;--border:#1e2d45;
  --accent:#00e5ff;--accent2:#7b2fff;--accent3:#ff3d71;--text:#e8f0ff;--muted:#5a6f8a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
header{padding:40px 60px 30px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.logo-group h1{font-family:'Bebas Neue',sans-serif;font-size:80px;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-group p{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.status-bar{display:flex;align-items:center;gap:14px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.controls{padding:24px 60px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border);}
.controls label{font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:2px;}
select,input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:6px;outline:none;}
select:focus,input:focus{border-color:var(--accent);}
.btn{padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;}
.btn-primary{background:var(--accent);color:#000;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
main{padding:40px 60px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin-bottom:32px;}
.stat-card-kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:.3s;}
.card:hover{transform:translateY(-4px);border-color:rgba(0,229,255,.4);}
.card-image{width:100%;height:220px;object-fit:cover;background:var(--surface2);}
.img-placeholder{width:100%;height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;background:var(--surface2);}
.car-icon{font-size:40px;opacity:.15;filter: grayscale(1);}
.img-label{font-size:11px;color:var(--muted);letter-spacing:2px;font-family:'Space Mono',monospace;}
.card-body{padding:20px;}
.card-make{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--accent);}
.card-model{font-size:18px;font-weight:600;}
.card-year{font-size:11px;color:var(--muted);margin-top:4px;font-family:'Space Mono',monospace;}
.card-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.tag{padding:4px 10px;border-radius:4px;font-size:10px;font-family:'Space Mono',monospace;}
.tag-bev{background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.2);color:var(--accent);}
.tag-phev{background:rgba(123,47,255,.1);border:1px solid rgba(123,47,255,.2);color:var(--accent2);}
.tag-range{background:rgba(255,61,113,.1);border:1px solid rgba(255,61,113,.2);color:var(--accent3);}
.card-stats{margin-top:18px;border-top:1px solid var(--border);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-label{font-size:9px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:2px;}
.stat-value{margin-top:4px;font-size:14px;font-weight:600;}
.pagination{display:flex;justify-content:center;gap:10px;margin-top:40px;}
.page-btn{padding:8px 14px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;cursor:pointer;}
.page-btn.active{border-color:var(--accent);color:var(--accent);}
.empty-state{text-align:center;padding:80px 20px;color:var(--muted);}
.empty-state h3{font-size:40px;font-family:'Bebas Neue',sans-serif;}
</style>
</head>
<body>

<header>
  <div class="logo-group">
    <h1>EV FLEET</h1>
    <p>Catálogo de vehículos eléctricos</p>
  </div>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="total-count">CARGANDO...</span>
  </div>
</header>

<div class="controls">
  <label>MARCA</label>
  <select id="filter-make"><option value="">Todas</option></select>
  <label>AÑO</label>
  <select id="filter-year"><option value="">Todos</option></select>
  <label>TIPO</label>
  <select id="filter-type">
    <option value="">Todos</option>
    <option value="Battery Electric Vehicle (BEV)">BEV</option>
    <option value="Plug-in Hybrid Electric Vehicle (PHEV)">PHEV</option>
  </select>
  <label>BUSCAR</label>
  <input type="text" id="search" placeholder="Modelo, VIN...">
  <button class="btn btn-primary" onclick="applyFilters()">FILTRAR</button>
  <button class="btn btn-ghost" onclick="resetFilters()">RESET</button>
</div>

<main>
  <div class="stats-grid">
    <div class="stat-card-kpi">
      <div class="stat-label">CO2 TOTAL AHORRADO</div>
      <div class="stat-value" id="kpi-co2" style="font-size:28px;color:var(--accent);">0 kg</div>
    </div>
    <div class="stat-card-kpi" style="border-color:var(--accent2);">
      <div class="stat-label">VEHÍCULOS MONITOREADOS</div>
      <div class="stat-value" id="kpi-vehiculos" style="font-size:28px;color:var(--accent2);">0</div>
    </div>
    <div class="stat-card-kpi" style="border-color:var(--accent3);">
      <div class="stat-label">KM PROMEDIO RECORRIDO</div>
      <div class="stat-value" id="kpi-km" style="font-size:28px;color:var(--accent3);">0 km</div>
    </div>
  </div>

  <div style="margin-bottom:20px;">
    <p style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:2px;">CATÁLOGO DE VEHÍCULOS (PINOT)</p>
  </div>

  <div id="catalog" class="grid"></div>
  <div id="pagination" class="pagination"></div>
</main>

<script>
// ── Estado global ──────────────────────────────────────
let allVehicles = [];
let allProducts = [];
let productsById = {};   // Mapa dol_vehicle_id -> producto
let productsByName = {}; // Mapa "marca modelo" -> producto
let productsByMake = {}; // Mapa "marca" -> [productos]
const PAGE_SIZE = 12;
let currentPage = 1;

// Guarda los filtros activos para que la paginación los conserve
let activeFilters = {};

// ── Analytics ──────────────────────────────────────────
async function cargarAnalytics() {
  try {
    const res  = await fetch('/analytics/emissions-report');
    const data = await res.json();
    if (data.length > 0) {
      const s = data[0];
      document.getElementById('kpi-co2').innerText      = `${Math.round(s.co2_total_ahorrado   || 0).toLocaleString()} kg`;
      document.getElementById('kpi-vehiculos').innerText = s.vehiculos_monitoreados || 0;
      document.getElementById('kpi-km').innerText        = `${Math.round(s.km_promedio_recorrido || 0).toLocaleString()} km`;
    }
  } catch(e) { console.error('Analytics error:', e); }
}

// ── Poblar filtros desde Pinot ─────────────────────────
async function poblarFiltros() {
  try {
    const [makesRes, yearsRes] = await Promise.all([
      fetch('/vehicles/makes'),
      fetch('/vehicles/years')
    ]);
    const makes = await makesRes.json();
    const years = await yearsRes.json();

    const makeSelect = document.getElementById('filter-make');
    makes.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.make; opt.textContent = m.make;
      makeSelect.appendChild(opt);
    });

    const yearSelect = document.getElementById('filter-year');
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y.model_year; opt.textContent = y.model_year;
      yearSelect.appendChild(opt);
    });
  } catch(e) { console.error('Error poblando filtros:', e); }
}

// ── Cargar productos y crear mapa marca→imagen ─────────
async function cargarProductos() {
  try {
    const res  = await fetch('/products/');
    allProducts = await res.json();
    console.log("Productos (imágenes) cargados:", allProducts.length);
    allProducts.forEach(p => {
      // 1. Mapeo por ID (aseguramos que sea String para comparar bien)
      if (p.vehicle_id) productsById[String(p.vehicle_id)] = p;

      // 2. Mapeo por Nombre y Marca para mejorar la búsqueda
      if (p.name && p.name.trim() !== "") {
        const full = p.name.toLowerCase().trim();
        productsByName[full] = p;

        // Extraer la primera palabra como marca
        const make = full.split(' ')[0];
        if (!productsByMake[make]) productsByMake[make] = [];
        productsByMake[make].push(p);
      }
    });
  } catch(e) { console.warn('Error cargando productos (usando placeholders):', e); }
}

// ── Obtener imagen para un vehículo ───────────────────
function getImageForVehicle(vehicle) {
  if (allProducts.length === 0) return null;

  // Usamos el ID de DOL (único por vehículo) como semilla para la selección.
  // Esto garantiza que el mismo coche siempre tenga la misma imagen, pero coches distintos no.
  const vehicleIdStr = String(vehicle.dol_vehicle_id || '');
  const seed = parseInt(vehicleIdStr) || 0;

  // 1. Prioridad: Coincidencia exacta por ID de DOL (si el worker lo vinculó en PocketBase)
  if (vehicleIdStr && productsById[vehicleIdStr]) {
    return productsById[vehicleIdStr].image_url;
  }

  const targetMake  = (vehicle.make  || '').toLowerCase().trim();
  const targetModel = (vehicle.model || '').toLowerCase().trim();

  // 2. Coincidencia por Modelo: Buscamos TODOS los productos que mencionen marca y modelo.
  // Filtramos para poder elegir entre varias imágenes si existen, usando el seed.
  const modelMatches = allProducts.filter(p => {
    if (!p.name) return false;
    const pName = p.name.toLowerCase();
    return pName.includes(targetMake) && pName.includes(targetModel);
  });

  if (modelMatches.length > 0) {
    // Variamos la imagen según el ID del vehículo para dar dinamismo a la lista
    return modelMatches[seed % modelMatches.length].image_url;
  }

  // 3. Coincidencia por Marca: Si no hay del modelo, buscamos cualquier imagen de esa Marca
  if (productsByMake[targetMake] && productsByMake[targetMake].length > 0) {
    const list = productsByMake[targetMake];
    return list[seed % list.length].image_url;
  }

  // 4. Si no hay nada de la marca, mostramos el placeholder (no mezclar marcas ajenas)
  return null;
}

// ── Fetch central de vehículos ─────────────────────────
async function fetchVehiculos(filters, page) {
  const params = new URLSearchParams();
  if (filters.make)         params.append('make',         filters.make);
  if (filters.year)         params.append('year',         filters.year);
  if (filters.vehicle_type) params.append('vehicle_type', filters.vehicle_type);
  if (filters.search)       params.append('search',       filters.search);
  params.append('page',      page);
  params.append('page_size', PAGE_SIZE);

  const res = await fetch(`/vehicles/?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── Aplicar filtros — siempre página 1 ────────────────
function applyFilters() {
  activeFilters = {
    make:         document.getElementById('filter-make').value,
    year:         document.getElementById('filter-year').value,
    vehicle_type: document.getElementById('filter-type').value,
    search:       document.getElementById('search').value.trim()
  };
  currentPage = 1;
  cargarYRenderizar();
}

// ── Ir a página — conserva filtros activos ─────────────
function goToPage(page) {
  currentPage = page;
  cargarYRenderizar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Cargar y renderizar ────────────────────────────────
async function cargarYRenderizar() {
  const catalog = document.getElementById('catalog');
  if (currentPage === 1) catalog.innerHTML = '<div class="empty-state"><h3>CARGANDO...</h3></div>';
  
  try {
    allVehicles = await fetchVehiculos(activeFilters, currentPage);
    console.log(`Página ${currentPage}: ${allVehicles.length} registros recibidos.`);
    if (allVehicles.length > 0) console.log("Ejemplo del primer registro:", allVehicles[0]);
    renderCatalog();
  } catch(e) {
    console.error('Error cargando vehículos:', e);
    catalog.innerHTML = `<div class="empty-state"><h3>ERROR</h3><p>${e.message}</p></div>`;
  }
}

// ── Reset ──────────────────────────────────────────────
function resetFilters() {
  document.getElementById('filter-make').value    = '';
  document.getElementById('filter-year').value    = '';
  document.getElementById('filter-type').value    = '';
  document.getElementById('search').value         = '';
  activeFilters = {};
  currentPage   = 1;
  cargarYRenderizar();
}

// ── Render ─────────────────────────────────────────────
function renderCatalog() {
  const catalog    = document.getElementById('catalog');
  const totalCount = document.getElementById('total-count');
  const pagination = document.getElementById('pagination');

  totalCount.textContent = `${allVehicles.length} VEHÍCULOS`;
  catalog.innerHTML = '';

  if (allVehicles.length === 0) {
    catalog.innerHTML = `
      <div class="empty-state">
        <h3>SIN RESULTADOS</h3>
        <p>No hay vehículos que coincidan con los filtros</p>
      </div>`;
    pagination.innerHTML = '';
    return;
  }

  allVehicles.forEach((vehicle, index) => {
    const isBEV    = (vehicle.electric_vehicle_type || '').includes('BEV');
    const imageUrl = getImageForVehicle(vehicle);

    const imageHTML = imageUrl
      ? `<img class="card-image" src="${imageUrl}" alt="${vehicle.make || ''}" onerror="this.parentElement.innerHTML='<div class=img-placeholder><span class=car-icon>🚗</span><span class=img-label>SIN IMAGEN</span></div>'">`
      : `<div class="img-placeholder"><span class="car-icon">🚗</span><span class="img-label">SIN IMAGEN</span></div>`;

    catalog.innerHTML += `
      <div class="card">
        ${imageHTML}
        <div class="card-body">
          <div class="card-make">${vehicle.make || 'N/A'}</div>
          <div class="card-model">${vehicle.model || 'N/A'}</div>
          <div class="card-year">MODEL YEAR ${vehicle.model_year || 'N/A'}</div>
          <div class="card-tags">
            <div class="tag ${isBEV ? 'tag-bev' : 'tag-phev'}">${isBEV ? 'BEV' : 'PHEV'}</div>
            <div class="tag tag-range">⚡ ${vehicle.electric_range || 'N/A'} mi</div>
          </div>
          <div class="card-stats">
            <div><div class="stat-label">CIUDAD</div><div class="stat-value">${vehicle.city || 'N/A'}</div></div>
            <div><div class="stat-label">TIPO</div><div class="stat-value">${isBEV ? 'BEV' : 'PHEV'}</div></div>
            <div><div class="stat-label">AUTONOMÍA</div><div class="stat-value">${vehicle.electric_range || 'N/A'} mi</div></div>
            <div><div class="stat-label">ID DOL</div><div class="stat-value">${vehicle.dol_vehicle_id || 'N/A'}</div></div>
          </div>
        </div>
      </div>`;
  });

  // ── Paginación — usa goToPage, NO applyFilters ────────
  pagination.innerHTML = '';
  const hasPrev = currentPage > 1;
  const hasNext = allVehicles.length === PAGE_SIZE;

  if (hasPrev) {
    const btn = document.createElement('button');
    btn.className   = 'page-btn';
    btn.textContent = '← Anterior';
    btn.onclick     = () => goToPage(currentPage - 1);
    pagination.appendChild(btn);
  }

  const info = document.createElement('span');
  info.className   = 'page-btn active';
  info.textContent = `Página ${currentPage}`;
  pagination.appendChild(info);

  if (hasNext) {
    const btn = document.createElement('button');
    btn.className   = 'page-btn';
    btn.textContent = 'Siguiente →';
    btn.onclick     = () => goToPage(currentPage + 1);
    pagination.appendChild(btn);
  }
}

// ── Eventos ────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('filter-make').addEventListener('change', applyFilters);
  document.getElementById('filter-year').addEventListener('change', applyFilters);
  document.getElementById('filter-type').addEventListener('change', applyFilters);
});

// ── Inicio ─────────────────────────────────────────────
window.onload = async () => {
  console.log("Iniciando aplicación...");
  // No bloqueamos el catálogo si fallan los filtros o las imágenes
  poblarFiltros().catch(console.error);
  cargarProductos().finally(() => {
    cargarAnalytics();
    cargarYRenderizar();
  });
};
</script>
</body>
</html>
